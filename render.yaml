services:
  - type: web
    name: universo-origen-web
    env: node
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node ./server/index.js
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: universo-origen-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: universo-origen-db
    plan: free
    databaseName: universo_origen
    user: universo_origen